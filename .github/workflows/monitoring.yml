name: Aktualizuj indeks prawa
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: legal-monitor-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pobierz indeks nowych materiałów
        run: python scripts/update_monitoring.py
      - name: Zapisz wyniki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/monitoring.json
          if ! git diff --cached --quiet; then
            git commit -m "Aktualizacja indeksu prawa"
            git push
          fi
